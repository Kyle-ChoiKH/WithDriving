org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Vroomi contest settings ----
# Replace with your real team name (ASCII letters/digits). It becomes the APK name:
#   apk/<teamName>_Vroomi_release.apk
vroomi.teamName=TEAMNAME

# AAOS standard vehicle speed (PERF_VEHICLE_SPEED, android.car.permission.CAR_SPEED).
# Keep false until the organizers confirm it is allowed on Pleos App Market.
# When true you must ALSO add the CAR_SPEED permission to app/src/main/AndroidManifest.xml.
vroomi.allowAaosSpeed=false

# Climate control from voice commands (pleos.car.permission.CONTROL_CAR_CLIMATE).
# Keep false until Pleos App Market approves the control permission for this app.
# When true you must ALSO add CONTROL_CAR_CLIMATE to app/src/main/AndroidManifest.xml.
vroomi.allowHvacControl=false
